<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جمرة غضى - إرسال التذكير والشكر</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script type="module">
  // استخدام type="module" يسمح بالاستيراد المباشر لحل التعارض مع Babel
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // نفس مشروع Firebase المستخدم بالموقع الرئيسي (my_projet) — نفس حساب الدخول
  const firebaseConfig = {
    apiKey: "AIzaSyAAYOne0CTht9906nStecbqCHkb_CY6glw",
    authDomain: "jamrat-ghadah.firebaseapp.com",
    projectId: "jamrat-ghadah",
    storageBucket: "jamrat-ghadah.appspot.com",
  };
  
  const fbApp = initializeApp(firebaseConfig);
  window.__fb = {
    auth: getAuth(fbApp),
    db: getFirestore(fbApp),
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut,
    collection,
    query,
    where,
    onSnapshot,
  };
  window.dispatchEvent(new Event("jg-firebase-ready"));
</script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Tajawal, Cairo, sans-serif; background: #FFFBF5; color: #2C2C2C; }
  input, textarea, select {
    width: 100%; padding: 9px 10px; border-radius: 10px; border: 1px solid #EDE3D3;
    background: #fff; font-family: inherit; font-size: 13px; outline: none; box-sizing: border-box;
  }
  button { cursor: pointer; border: none; border-radius: 10px; font-size: 12px; font-weight: 700; padding: 9px 16px; }
  .btn-gold { background: #C5A059; color: #fff; }
  .btn-dark { background: #2C2C2C; color: #fff; }
  .btn-outline { background: #fff; color: #2C2C2C; border: 1px solid #EDE3D3; }
  button:disabled { opacity: .5; cursor: default; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: right; padding: 8px 6px; border-bottom: 1px solid #F5EFE6; vertical-align: middle; }
  th { color: #999; font-weight: 600; font-size: 11px; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; }
  .card { background: linear-gradient(180deg,#F5EFE6,#FFFBF5); border: 1px solid #EDE3D3; }
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

// ---------- إعدادات افتراضية (تُحفظ محليًا بالمتصفح) ----------
const defaultConfig = {
  videoLink: "",
  cloudinaryCloudName: "",
  cloudinaryUploadPreset: "",
  sendSecret: "", // نفس SEND_SECRET المضبوطة بـ Netlify

  reminderWhatsapp: "هلا {{name}} 💛 يذكّرك موعد المناسبة، ما ننتظر إلا حضوركم الكريم",
  reminderEmailSubject: "تذكير بمناسبتنا يا {{name}} 💛",
  reminderEmailText: "هلا {{name}}،\nيذكّرك موعد مناسبتنا القريب، بانتظار حضورك الكريم 💛",

  thanksWhatsapp: "شكرًا {{name}} 🌹 حضورك زانّ المناسبة، ودامت الأفراح",
  thanksEmailSubject: "شكرًا لحضورك يا {{name}} 🌹",
  thanksEmailText: "هلا {{name}}،\nنشكر لك حضورك وتشريفك لنا، دام الفرح والسرور 🌹",

  goldColor: "#C5A059",
  sideText: "Jamrat Ghadah",
  topText: "كود دخولك الشخصي",
};

function fillTemplate(tpl, guest) {
  return (tpl || "").replaceAll("{{name}}", guest.name || "ضيفة").replaceAll("{{code}}", guest.entryCode || "");
}

// ---------- مكوّن رسم QR ----------
function QR({ data, size, color }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    ref.current.innerHTML = "";
    try {
      if (window.QRCode && data) {
        new window.QRCode(ref.current, {
          text: data, width: size, height: size,
          colorDark: color, colorLight: "#FFFFFF",
          correctLevel: window.QRCode.CorrectLevel.M,
        });
      }
    } catch (e) {}
  }, [data, size, color]);
  return <div ref={ref} style={{ width: size, height: size, background: "#fff", borderRadius: 8 }} />;
}

async function uploadToCloudinary(blob, filename, config) {
  if (!config.cloudinaryCloudName || !config.cloudinaryUploadPreset) {
    throw new Error("عبّي إعدادات Cloudinary (cloudName + upload preset) أول");
  }
  const url = `https://api.cloudinary.com/v1_1/${config.cloudinaryCloudName}/image/upload`;
  const form = new FormData();
  form.append("file", blob, filename);
  form.append("upload_preset", config.cloudinaryUploadPreset);
  const res = await fetch(url, { method: "POST", body: form });
  const data = await res.json();
  if (!res.ok || !data.secure_url) throw new Error(data?.error?.message || "فشل رفع البطاقة لـ Cloudinary");
  return data.secure_url;
}

// ---------- بوابة تسجيل الدخول (نفس حساب لوحة تحكم الموقع) ----------
function LoginGate({ onReady }) {
  const [ready, setReady] = useState(false);
  const [user, setUser] = useState(null);
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    function attach() {
      const fb = window.__fb;
      if (!fb) return;
      setReady(true);
      fb.onAuthStateChanged(fb.auth, (u) => setUser(u));
    }
    if (window.__fb) attach();
    else window.addEventListener("jg-firebase-ready", attach, { once: true });
  }, []);

  async function login() {
    setErr(""); setBusy(true);
    try {
      await window.__fb.signInWithEmailAndPassword(window.__fb.auth, email, pw);
    } catch (e) {
      setErr("الإيميل أو كلمة المرور غير صحيحة");
    }
    setBusy(false);
  }

  if (!ready) return <div style={{ padding: 40, textAlign: "center", fontSize: 13, opacity: .6 }}>جارِ التحميل...</div>;

  if (user) return onReady(user);

  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ background: "#fff", border: "1px solid #F0E6D6", borderRadius: 20, padding: 32, maxWidth: 320, width: "90%", textAlign: "center" }}>
        <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 14 }}>🔒 جمرة غضى - نظام الإرسال</div>
        <input placeholder="الإيميل" value={email} onChange={e => setEmail(e.target.value)} style={{ marginBottom: 10, textAlign: "center" }} />
        <input type="password" placeholder="كلمة المرور" value={pw} onChange={e => setPw(e.target.value)} onKeyDown={e => e.key === "Enter" && login()} style={{ marginBottom: 10, textAlign: "center" }} />
        <button className="btn-dark" style={{ width: "100%" }} onClick={login} disabled={busy}>{busy ? "..." : "دخول"}</button>
        {err && <div style={{ color: "#DC2626", fontSize: 12, marginTop: 10 }}>{err}</div>}
        <div style={{ fontSize: 11, opacity: .5, marginTop: 12 }}>نفس حساب لوحة تحكم الموقع الرئيسي</div>
      </div>
    </div>
  );
}

// ---------- المكوّن الرئيسي ----------
function App({ user }) {
  const urlParams = new URLSearchParams(window.location.search);
  const eventCode = urlParams.get("event") || "";

  const [config, setConfig] = useState(defaultConfig);
  const [eventMeta, setEventMeta] = useState(null);
  const [eventErr, setEventErr] = useState("");
  const [guests, setGuests] = useState([]);
  const [manualGuests, setManualGuests] = useState([]);
  const [sentLog, setSentLog] = useState({});
  const [mode, setMode] = useState("reminder");
  const [currentId, setCurrentId] = useState("");
  const [log, setLog] = useState("");
  const cardRef = useRef(null);

  useEffect(() => {
    try {
      const c = localStorage.getItem("jamrat_send_config_v3");
      if (c) setConfig({ ...defaultConfig, ...JSON.parse(c) });
    } catch {}
  }, []);
  useEffect(() => { try { localStorage.setItem("jamrat_send_config_v3", JSON.stringify(config)); } catch {} }, [config]);

  useEffect(() => {
    if (!eventCode) return;
    try {
      const s = localStorage.getItem("jamrat_sentlog_" + eventCode);
      if (s) setSentLog(JSON.parse(s));
      const m = localStorage.getItem("jamrat_manual_" + eventCode);
      if (m) setManualGuests(JSON.parse(m));
    } catch {}
  }, [eventCode]);
  useEffect(() => {
    if (!eventCode) return;
    try { localStorage.setItem("jamrat_sentlog_" + eventCode, JSON.stringify(sentLog)); } catch {}
  }, [sentLog, eventCode]);
  useEffect(() => {
    if (!eventCode) return;
    try { localStorage.setItem("jamrat_manual_" + eventCode, JSON.stringify(manualGuests)); } catch {}
  }, [manualGuests, eventCode]);

  useEffect(() => {
    if (!eventCode) { setEventErr("افتحي هذي الصفحة من رابط عميلة بلوحة إدارة المناسبات (events.html)"); return; }
    if (!config.sendSecret) return;
    fetch("/.netlify/functions/events-list", { headers: { "x-send-secret": config.sendSecret } })
      .then(r => r.json())
      .then(data => {
        if (!data.ok) { setEventErr(data.message || "تعذر تحميل بيانات المناسبة"); return; }
        const ev = (data.events || []).find(e => e.eventCode === eventCode);
        if (!ev) { setEventErr("رمز المناسبة غير مسجّل بلوحة إدارة المناسبات"); return; }
        if (!ev.slug) { setEventErr("هذي المناسبة ما فيها اسم قالب دعوة بالموقع — عدّليها من events.html"); return; }
        setEventMeta(ev);
        setEventErr("");
      })
      .catch(() => setEventErr("تعذر الاتصال بالسيرفر"));
  }, [eventCode, config.sendSecret]);

  useEffect(() => {
    if (!eventMeta?.slug || !window.__fb) return;
    const fb = window.__fb;
    const q = fb.query(
      fb.collection(fb.db, "responses"),
      fb.where("style", "==", eventMeta.slug),
      fb.where("status", "==", "yes")
    );
    const unsub = fb.onSnapshot(q, (snap) => {
      const rows = [];
      snap.forEach((doc) => {
        const d = doc.data();
        rows.push({
          id: doc.id,
          name: d.name || "ضيفة",
          phone: (d.phone || "").replace(/[^0-9]/g, ""),
          email: d.email || "",
          entryCode: d.entryCode || "",
          guestsCount: d.guests || "",
        });
      });
      setGuests(rows);
    }, () => setEventErr("تعذرت قراءة ردود الموقع — تأكدي إنك مسجّلة دخول بنفس الحساب"));
    return () => unsub();
  }, [eventMeta]);

  const allGuests = useMemo(() => [...guests, ...manualGuests], [guests, manualGuests]);
  const current = useMemo(() => allGuests.find(g => g.id === currentId) || allGuests[0], [allGuests, currentId]);
  const entryLink = current ? current.entryCode : "";

  function addManual() {
    const name = prompt("اسم الضيف؟");
    if (!name) return;
    const phone = (prompt("رقم الجوال (966...)؟") || "").replace(/[^0-9]/g, "");
    const email = prompt("الإيميل؟") || "";
    const entryCode = "JG-" + Math.random().toString(36).slice(2, 10).toUpperCase();
    setManualGuests(gs => [{ id: "manual-" + Date.now(), name, phone, email, entryCode, guestsCount: "", manual: true }, ...gs]);
  }

  async function captureCardBlob() {
    if (!window.html2canvas || !cardRef.current) throw new Error("html2canvas ما تحمّل بعد");
    const canvas = await window.html2canvas(cardRef.current, { scale: 2, useCORS: true, backgroundColor: null });
    return new Promise(resolve => canvas.toBlob(resolve, "image/png"));
  }

  function guestSentInfo(g) {
    return (sentLog[g.entryCode] || {})[mode];
  }
  function markSent(g, ok, note) {
    setSentLog(s => ({
      ...s,
      [g.entryCode]: { ...s[g.entryCode], [mode]: { ok, note, at: new Date().toISOString() } },
    }));
  }

  async function sendToGuest(g) {
    setCurrentId(g.id);
    await new Promise(r => setTimeout(r, 250));

    let cardUrl = "";
    try {
      const blob = await captureCardBlob();
      cardUrl = await uploadToCloudinary(blob, `card-${g.entryCode}.png`, config);
    } catch (e) {
      markSent(g, false, "فشل توليد/رفع البطاقة: " + e.message);
      return;
    }

    const waTpl = mode === "reminder" ? config.reminderWhatsapp : config.thanksWhatsapp;
    const subjTpl = mode === "reminder" ? config.reminderEmailSubject : config.thanksEmailSubject;
    const textTpl = mode === "reminder" ? config.reminderEmailText : config.thanksEmailText;

    let waOk = false, waErr = "";
    if (g.phone && g.phone.length >= 8) {
      try {
        const res = await fetch("/.netlify/functions/send-whatsapp", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-send-secret": config.sendSecret || "" },
          body: JSON.stringify({ to: g.phone, message: fillTemplate(waTpl, g), videoUrl: config.videoLink || undefined, cardUrl }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) waOk = true; else waErr = data.message || "فشل واتساب";
      } catch (e) { waErr = "تعذر الاتصال بدالة واتساب"; }
    } else {
      waErr = "رقم غير صحيح";
    }

    let emailOk = false, emailErr = "";
    if ((g.email || "").includes("@")) {
      try {
        const res = await fetch("/.netlify/functions/send-email", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-send-secret": config.sendSecret || "" },
          body: JSON.stringify({ to: g.email, subject: fillTemplate(subjTpl, g), text: fillTemplate(textTpl, g), videoUrl: config.videoLink || undefined, cardUrl }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) emailOk = true; else emailErr = data.message || "فشل الإيميل";
      } catch (e) { emailErr = "تعذر الاتصال بدالة الإيميل"; }
    } else {
      emailErr = "بدون إيميل";
    }

    if (waOk || emailOk) {
      markSent(g, true, [waOk && "واتساب", emailOk && "إيميل"].filter(Boolean).join(" + "));
    } else {
      markSent(g, false, [waErr, emailErr].filter(Boolean).join(" | "));
    }
  }

  async function sendToAll() {
    const pending = allGuests.filter(g => !guestSentInfo(g)?.ok);
    for (const g of pending) {
      setLog(`جارِ الإرسال لـ ${g.name}...`);
      await sendToGuest(g);
      await new Promise(r => setTimeout(r, 500));
    }
    setLog(`تم! أُرسل لـ ${pending.length} ضيف`);
  }

  if (!eventCode) {
    return <div style={{ padding: 40, textAlign: "center" }}>
      <p>افتحي هذي الصفحة من رابط عميلة بلوحة <a href="events.html">إدارة المناسبات</a></p>
    </div>;
  }

  if (!config.sendSecret) {
    return <div style={{ maxWidth: 380, margin: "60px auto", padding: 20, textAlign: "center" }}>
      <p style={{ marginBottom: 12 }}>عبّي كلمة سر الإرسال (SEND_SECRET) أول مرة:</p>
      <input type="password" placeholder="SEND_SECRET" onKeyDown={e => {
        if (e.key === "Enter") setConfig(c => ({ ...c, sendSecret: e.target.value }));
      }} />
    </div>;
  }

  return (
    <div style={{ maxWidth: 1200, margin: "0 auto", padding: 20 }}>
      <header style={{ marginBottom: 20, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div>
          <h1 style={{ fontSize: 18, fontWeight: 700, margin: 0 }}>
            {eventMeta ? `📨 ${eventMeta.clientName}` : "📨 جمرة غضى - الإرسال"}
          </h1>
          <p style={{ fontSize: 11, opacity: .6, margin: "4px 0 0" }}>
            {eventMeta ? `مربوطة بدعوة: ${eventMeta.slug} — ${guests.length} رد مؤكد (يتحدث لحظيًا من الموقع)` : "..."}
          </p>
        </div>
        <a href="events.html" style={{ fontSize: 12, color: "#999" }}>↩ رجوع للمناسبات</a>
      </header>

      {eventErr && (
        <div style={{ background: "#FEE2E2", border: "1px solid #FCA5A5", borderRadius: 14, padding: 14, marginBottom: 20, fontSize: 12 }}>
          ⚠️ {eventErr}
        </div>
      )}

      {(!config.cloudinaryCloudName || !config.cloudinaryUploadPreset) && (
        <div style={{ background: "#FFF3E0", border: "1px solid #F0E6D6", borderRadius: 14, padding: 14, marginBottom: 20, fontSize: 12, lineHeight: 1.8 }}>
          ⚠️ لسا ناقصة إعدادات Cloudinary (اسم الحساب + Upload preset) — عبّيهم بقسم "الإعدادات" قبل ما ترسلين.
        </div>
      )}

      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        <button className={mode === "reminder" ? "btn-gold" : "btn-outline"} onClick={() => setMode("reminder")}>🔔 وضع التذكير (قبل المناسبة)</button>
        <button className={mode === "thanks" ? "btn-gold" : "btn-outline"} onClick={() => setMode("thanks")}>🌹 وضع الشكر (بعد المناسبة)</button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "380px 1fr", gap: 20, alignItems: "start" }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          <section style={{ background: "white", border: "1px solid #F0E6D6", borderRadius: 16, padding: 16 }}>
            <h3 style={{ fontSize: 13, fontWeight: 700, marginBottom: 10 }}>الإعدادات</h3>
            <Field label="رابط فيديو الدعوة (Cloudinary)">
              <input value={config.videoLink} onChange={e => setConfig(c => ({ ...c, videoLink: e.target.value }))} dir="ltr" />
            </Field>
            <Field label="Cloudinary Cloud Name">
              <input value={config.cloudinaryCloudName} onChange={e => setConfig(c => ({ ...c, cloudinaryCloudName: e.target.value }))} dir="ltr" />
            </Field>
            <Field label="Cloudinary Upload Preset (Unsigned)">
              <input value={config.cloudinaryUploadPreset} onChange={e => setConfig(c => ({ ...c, cloudinaryUploadPreset: e.target.value }))} dir="ltr" />
            </Field>
            <Field label="كلمة سر الإرسال (SEND_SECRET)">
              <input type="password" value={config.sendSecret} onChange={e => setConfig(c => ({ ...c, sendSecret: e.target.value }))} dir="ltr" />
            </Field>
          </section>

          <section style={{ background: "white", border: "1px solid #F0E6D6", borderRadius: 16, padding: 16 }}>
            <h3 style={{ fontSize: 13, fontWeight: 700, marginBottom: 10 }}>
              رسائل {mode === "reminder" ? "التذكير" : "الشكر"} (المتغيرات: {"{{name}} {{code}}"})
            </h3>
            {mode === "reminder" ? (
              <React.Fragment>
                <Field label="نص واتساب"><textarea rows={3} value={config.reminderWhatsapp} onChange={e => setConfig(c => ({ ...c, reminderWhatsapp: e.target.value }))} /></Field>
                <Field label="عنوان الإيميل"><input value={config.reminderEmailSubject} onChange={e => setConfig(c => ({ ...c, reminderEmailSubject: e.target.value }))} /></Field>
                <Field label="نص الإيميل"><textarea rows={3} value={config.reminderEmailText} onChange={e => setConfig(c => ({ ...c, reminderEmailText: e.target.value }))} /></Field>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <Field label="نص واتساب"><textarea rows={3} value={config.thanksWhatsapp} onChange={e => setConfig(c => ({ ...c, thanksWhatsapp: e.target.value }))} /></Field>
                <Field label="عنوان الإيميل"><input value={config.thanksEmailSubject} onChange={e => setConfig(c => ({ ...c, thanksEmailSubject: e.target.value }))} /></Field>
                <Field label="نص الإيميل"><textarea rows={3} value={config.thanksEmailText} onChange={e => setConfig(c => ({ ...c, thanksEmailText: e.target.value }))} /></Field>
              </React.Fragment>
            )}
          </section>

          <section style={{ background: "white", border: "1px solid #F0E6D6", borderRadius: 16, padding: 16 }}>
            <h3 style={{ fontSize: 13, fontWeight: 700, marginBottom: 10 }}>معاينة البطاقة</h3>
            <select value={currentId} onChange={e => setCurrentId(e.target.value)}>
              {allGuests.map(g => <option key={g.id} value={g.id}>{g.name} - {g.entryCode}</option>)}
            </select>
          </section>
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
          <div style={{ display: "flex", justifyContent: "center" }}>
            <div ref={cardRef} className="card" style={{
              width: 320, minHeight: 420, borderRadius: 24, padding: 24,
              display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "space-between",
              boxShadow: "0 20px 60px -15px rgba(0,0,0,.3)",
            }}>
              <p style={{ fontFamily: "Cairo", fontSize: 12, opacity: .7, textAlign: "center" }}>{config.topText}</p>
              <QR data={entryLink} size={140} color={config.goldColor} />
              <p style={{ fontFamily: "monospace", fontSize: 13, letterSpacing: 2, color: config.goldColor, fontWeight: "bold" }}>{entryLink}</p>
              <p style={{ fontFamily: "Georgia", fontSize: 22, color: config.goldColor }}>{config.sideText}</p>
              <p style={{ fontSize: 11, opacity: .6 }}>{current?.name}</p>
            </div>
          </div>

          <section style={{ background: "white", border: "1px solid #F0E6D6", borderRadius: 16, padding: 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <h3 style={{ fontSize: 13, fontWeight: 700 }}>المدعوّون المؤكدون ({allGuests.length})</h3>
              <div style={{ display: "flex", gap: 8 }}>
                <button className="btn-outline" onClick={addManual}>+ إضافة يدوية</button>
                <button className="btn-gold" onClick={sendToAll}>إرسال جماعي ({mode === "reminder" ? "تذكير" : "شكر"})</button>
              </div>
            </div>

            <div style={{ overflowX: "auto" }}>
              <table>
                <thead><tr>
                  <th>الاسم</th><th>الجوال</th><th>الحالة</th><th>إجراء</th>
                </tr></thead>
                <tbody>
                  {allGuests.map(g => {
                    const info = guestSentInfo(g);
                    return (
                      <tr key={g.id}>
                        <td>{g.name}<div style={{ fontSize: 10, opacity: .5 }}>{g.entryCode}{g.manual && " · يدوي"}</div></td>
                        <td dir="ltr" style={{ fontSize: 11 }}>{g.phone || "—"}</td>
                        <td>
                          {!info && <span className="pill" style={{ background: "#F5F5F5" }}>لم يرسل</span>}
                          {info?.ok && <span className="pill" style={{ background: "#D1FAE5" }} title={info.note}>✅ {info.note}</span>}
                          {info && !info.ok && <span className="pill" style={{ background: "#FEE2E2" }} title={info.note}>❌ فشل</span>}
                        </td>
                        <td><button className="btn-gold" onClick={() => sendToGuest(g)}>إرسال</button></td>
                      </tr>
                    );
                  })}
                  {!allGuests.length && (
                    <tr><td colSpan="4" style={{ textAlign: "center", opacity: .5, padding: 20 }}>
                      ما فيه ردود مؤكدة بعد لهذي الدعوة — بتظهر هنا تلقائيًا فور ما ضيف يؤكد حضوره بالموقع
                    </td></tr>
                  )}
                </tbody>
              </table>
            </div>
            {log && <p style={{ fontSize: 11, opacity: .6, marginTop: 8 }}>{log}</p>}
          </section>
        </div>
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <label style={{ display: "block", marginBottom: 10 }}>
      <span style={{ fontSize: 11, opacity: .7 }}>{label}</span>
      <div style={{ marginTop: 4 }}>{children}</div>
    </label>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <LoginGate onReady={(user) => <App user={user} />} />
);
</script>
</body>
</html>
