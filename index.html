<body>
  <div id="__gate__" style="position:fixed;inset:0;z-index:999999;background:#FFFBF5;display:flex;align-items:center;justify-content:center;font-family:Tajawal,Cairo,sans-serif;direction:rtl;">
    <div style="background:#fff;border:1px solid #F0E6D6;border-radius:20px;padding:32px;max-width:340px;width:90%;text-align:center;">
      <div style="font-weight:bold;font-size:16px;margin-bottom:14px;">🔒 لوحة تحكم جمرة غضى</div>
      <input id="__gate_email__" type="email" placeholder="الإيميل" style="width:100%;padding:14px;border-radius:14px;border:2px solid #EDE3D3;background:#FFFBF5;font-size:15px;text-align:center;outline:none;margin-bottom:10px;box-sizing:border-box;" dir="ltr">
      <input id="__gate_pw__" type="password" placeholder="كلمة المرور" style="width:100%;padding:14px;border-radius:14px;border:2px solid #C5A059;background:#FFFBF5;font-size:15px;text-align:center;outline:none;margin-bottom:10px;box-sizing:border-box;">
      <button id="__gate_btn__" style="width:100%;padding:12px;border-radius:12px;border:none;background:#2C2C2C;color:#fff;font-size:13px;font-weight:600;cursor:pointer;">دخول</button>
      <div id="__gate_err__" style="color:#DC2626;font-size:12px;margin-top:10px;display:none;"></div>
    </div>
  </div>
  <script type="module">
  (function(){
    var KEY = "jamrat_admin_gate_ok";
    if (sessionStorage.getItem(KEY) === "1") { var g = document.getElementById("__gate__"); if (g) g.remove(); }
  })();
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const __gateFirebaseConfig = {
    apiKey: "AIzaSyAAYOne0CTht9906nStecbqCHkb_CY6glw",
    authDomain: "jamrat-ghadah.firebaseapp.com",
    projectId: "jamrat-ghadah",
    storageBucket: "jamrat-ghadah.firebasestorage.app",
    messagingSenderId: "283693105617",
    appId: "1:283693105617:web:45645ef4e088f54934a0f0",
  };
  const __gateApp = initializeApp(__gateFirebaseConfig);
  const __gateAuth = getAuth(__gateApp);
  const KEY = "jamrat_admin_gate_ok";

  onAuthStateChanged(__gateAuth, function(user){
    if (user) {
      sessionStorage.setItem(KEY, "1");
      var g = document.getElementById("__gate__");
      if (g) g.remove();
    }
  });

  var btn = document.getElementById("__gate_btn__");
  async function check(){
    var email = document.getElementById("__gate_email__").value.trim();
    var pw = document.getElementById("__gate_pw__").value;
    var errEl = document.getElementById("__gate_err__");
    errEl.style.display = "none";
    btn.disabled = true; btn.textContent = "...";
    try {
      await signInWithEmailAndPassword(__gateAuth, email, pw);
      // onAuthStateChanged هو اللي بيشيل شاشة الدخول تلقائيًا
    } catch(e) {
      errEl.textContent = "الإيميل أو كلمة المرور غير صحيحة";
      errEl.style.display = "block";
    }
    btn.disabled = false; btn.textContent = "دخول";
  }
  btn.addEventListener("click", check);
  document.getElementById("__gate_pw__").addEventListener("keydown", function(e){ if (e.key === "Enter") check(); });
  </script>

  <script type="module">
// === Jamrat Firestore Sync (مضاف تلقائيًا) ===
// يراقب حفظ قائمة الضيوف بـlocalStorage ويرسلها لنفس قاعدة بيانات Firebase
// اللي يستخدمها الموقع (jamrat-ghadah)، بدون أي تعديل على منطق التطبيق نفسه.
import { getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// نفس تطبيق Firebase المستخدم في شاشة الدخول (نفس جلسة تسجيل الدخول)،
// عشان الكتابة بـ Firestore تصير موثّقة فعليًا (request.auth != null)
// بدل ما نفتح صلاحية الكتابة للعموم.
const __fbApp = getApp();
const __db = getFirestore(__fbApp);
const __syncAuth = getAuth(__fbApp);

let __syncTimer = null;
let __isAuthed = false;

function __showDebug(msg) {
  var el = document.getElementById("__sync_debug__");
  if (!el) return;
  el.style.display = "block";
  el.textContent = "[Jamrat Sync] " + msg;
}

const __originalSetItem = Storage.prototype.setItem;
Storage.prototype.setItem = function (key, value) {
  __originalSetItem.apply(this, arguments);
  if (key === "jamrat_guests_final") {
    clearTimeout(__syncTimer);
    __syncTimer = setTimeout(() => __syncGuestsToFirestore(value), 900);
  }
};

async function __syncGuestsToFirestore(rawValue) {
  if (!__isAuthed) {
    console.warn("Jamrat sync: لسه ما تم تسجيل الدخول، تأجيل المزامنة");
    __showDebug("لسه ما تم تسجيل الدخول - تأجيل المزامنة");
    return;
  }
  __showDebug("جاري المزامنة...");
  try {
    const guests = JSON.parse(rawValue);
    if (!Array.isArray(guests)) return;
    for (const g of guests) {
      if (!g.entryCode) continue;
      await setDoc(
        doc(__db, "guests", g.entryCode),
        {
          name: g.name || "",
          phone: g.phone || "",
          email: g.email || "",
          status: g.status || "idle",
          updatedAt: new Date().toISOString(),
        },
        { merge: true }
      );
    }
    console.log("Jamrat: تمت مزامنة " + guests.length + " ضيف مع Firestore");
    __showDebug("✅ تمت مزامنة " + guests.length + " ضيف بنجاح");
  } catch (err) {
    console.error("Jamrat sync error:", err);
    __showDebug("❌ خطأ: " + (err && err.message ? err.message : String(err)));
  }
}

// ننتظر تأكيد تسجيل الدخول الفعلي، وبعدها نزامن أي بيانات ضيوف محفوظة أصلًا
onAuthStateChanged(__syncAuth, function (user) {
  __isAuthed = !!user;
  __showDebug(user ? "✅ مسجّلة دخول (" + (user.email || "") + ")" : "⏳ لسه ما سجلتِ دخول");
  if (user) {
    try {
      const __existing = localStorage.getItem("jamrat_guests_final");
      if (__existing) __syncGuestsToFirestore(__existing);
    } catch {}
  }
});
</script>
