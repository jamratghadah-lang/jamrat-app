<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>إدارة المناسبات - جمرة غضى</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Tajawal, Cairo, sans-serif;
    background: #FFFBF5;
    color: #2C2C2C;
    min-height: 100vh;
  }
  header {
    background: #fff;
    border-bottom: 1px solid #F0E6D6;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header .brand { display: flex; align-items: center; gap: 10px; }
  header .logo {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg,#E8C88A,#C5A059);
    color: #fff; display:flex; align-items:center; justify-content:center;
    font-weight: bold; flex-shrink: 0;
  }
  header h1 { font-size: 14px; margin: 0; }
  header p { font-size: 10px; margin: 0; opacity: .6; }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
  .card {
    background: #fff;
    border: 1px solid #F0E6D6;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h3 { font-size: 14px; margin: 0 0 10px; display:flex; align-items:center; gap:6px; }
  .muted { font-size: 12px; opacity: .6; line-height: 1.8; margin: 0 0 14px; }
  input[type=text], input[type=password], input[type=date] {
    width: 100%;
    padding: 13px;
    border-radius: 14px;
    border: 2px solid #C5A059;
    background: #FFFBF5;
    font-size: 14px;
    outline: none;
    margin-bottom: 10px;
    box-sizing: border-box;
    font-family: inherit;
  }
  select {
    width: 100%;
    padding: 13px;
    border-radius: 14px;
    border: 2px solid #C5A059;
    background: #FFFBF5;
    font-size: 14px;
    outline: none;
    margin-bottom: 10px;
    font-family: inherit;
  }
  button {
    padding: 12px 18px;
    border-radius: 12px;
    border: none;
    background: #2C2C2C;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary { background: #FFFBF5; color: #2C2C2C; border: 1px solid #EDE3D3; }
  button.danger { background: #DC2626; color: #fff; }
  button.small { padding: 8px 14px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: default; }
  .section-title { font-size: 13px; font-weight: bold; color: #6b4a1e; margin: 22px 0 10px; display:flex; align-items:center; gap:6px; }
  .event-card {
    background: #fff; border: 1px solid #F0E6D6; border-radius: 16px;
    padding: 16px; margin-bottom: 10px;
  }
  .event-card.finished { opacity: .7; background: #FAF7F0; }
  .event-card .name { font-weight: bold; font-size: 14px; margin-bottom: 3px; }
  .event-card .meta { font-size: 11px; opacity: .6; margin-bottom: 10px; }
  .event-card .code { font-family: monospace; direction: ltr; display: inline-block; background: #FFFBF5; border: 1px solid #EDE3D3; border-radius: 8px; padding: 2px 8px; font-size: 11px; }
  .event-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .empty-state { text-align: center; padding: 24px 16px; opacity: .55; font-size: 13px; }
  .err { color: #DC2626; font-size: 12px; text-align: center; margin-top: 10px; }
  .ok { color: #16A34A; font-size: 12px; text-align: center; margin-top: 10px; }
</style>
</head>
<body>

<div id="__gate__" style="position:fixed;inset:0;z-index:999999;background:#FFFBF5;display:flex;align-items:center;justify-content:center;">
  <div style="background:#fff;border:1px solid #F0E6D6;border-radius:20px;padding:32px;max-width:320px;width:90%;text-align:center;">
    <div style="font-weight:bold;font-size:16px;margin-bottom:14px;">🔒 إدارة المناسبات - جمرة غضى</div>
    <input id="__gate_email__" type="text" placeholder="الإيميل" style="width:100%;padding:14px;border-radius:14px;border:2px solid #C5A059;background:#FFFBF5;font-size:15px;text-align:center;outline:none;margin-bottom:10px;box-sizing:border-box;" autofocus>
    <input id="__gate_pw__" type="password" placeholder="كلمة المرور" style="width:100%;padding:14px;border-radius:14px;border:2px solid #C5A059;background:#FFFBF5;font-size:15px;text-align:center;outline:none;margin-bottom:10px;box-sizing:border-box;">
    <button id="__gate_btn__" style="width:100%;padding:12px;border-radius:12px;border:none;background:#2C2C2C;color:#fff;font-size:13px;font-weight:600;cursor:pointer;">دخول</button>
    <div id="__gate_err__" style="color:#DC2626;font-size:12px;margin-top:10px;display:none;"></div>
  </div>
</div>
<script>
(function(){
  var KEY = "jamrat_events_gate_ok";
  if (sessionStorage.getItem(KEY) === "1") { document.getElementById("__gate__").remove(); return; }
  var btn = document.getElementById("__gate_btn__");
  async function check(){
    var email = document.getElementById("__gate_email__").value;
    var pw = document.getElementById("__gate_pw__").value;
    var errEl = document.getElementById("__gate_err__");
    errEl.style.display = "none";
    btn.disabled = true; btn.textContent = "...";
    try {
      var res = await fetch("/.netlify/functions/auth-check", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({scope:"admin", email:email, password:pw})
      });
      var data = await res.json().catch(function(){ return {}; });
      if (res.ok && data.ok) {
        sessionStorage.setItem(KEY, "1");
        document.getElementById("__gate__").remove();
      } else {
        errEl.textContent = data.message || "تعذر التحقق";
        errEl.style.display = "block";
      }
    } catch(e) {
      errEl.textContent = "تعذر الاتصال بالسيرفر";
      errEl.style.display = "block";
    }
    btn.disabled = false; btn.textContent = "دخول";
  }
  btn.addEventListener("click", check);
  document.getElementById("__gate_pw__").addEventListener("keydown", function(e){ if (e.key === "Enter") check(); });
})();
</script>

<header>
  <div class="brand">
    <div class="logo">J</div>
    <div>
      <h1>إدارة المناسبات</h1>
      <p>اشتغلي على أكثر من عميلة بنفس الوقت</p>
    </div>
  </div>
</header>

<main id="app"></main>

<script>
const FN_BASE = "/.netlify/functions";
const SECRET_KEY = "jamrat_send_secret";

function el(id) { return document.getElementById(id); }
function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function getSecret() {
  let secret = sessionStorage.getItem(SECRET_KEY);
  if (!secret) {
    secret = prompt("كلمة سر الإرسال (SEND_SECRET) — تُطلب مرة وحدة بس بكل جلسة:");
    if (secret) sessionStorage.setItem(SECRET_KEY, secret);
  }
  return secret;
}

async function api(path, opts) {
  opts = opts || {};
  const secret = getSecret();
  opts.headers = Object.assign({}, opts.headers, { "x-send-secret": secret || "" });
  const res = await fetch(FN_BASE + path, opts);
  let data = {};
  try { data = await res.json(); } catch {}
  if (res.status === 401) sessionStorage.removeItem(SECRET_KEY); // كلمة السر غلط، نطلبها مرة ثانية بالمحاولة الجاية
  return { ok: res.ok, data };
}

let events = [];
let loading = true;
let msg = "";
let msgType = "";

async function loadEvents() {
  loading = true; render();
  const { ok, data } = await api("/events-list", { method: "GET" });
  loading = false;
  if (ok && data.ok) {
    events = data.events || [];
  } else {
    msg = (data && data.message) || "تعذر تحميل المناسبات";
    msgType = "err";
  }
  render();
}

async function createEvent() {
  const clientName = document.getElementById("newClientName").value.trim();
  const eventCode = document.getElementById("newEventCode").value.trim();
  const eventType = document.getElementById("newEventType").value;
  const eventDate = document.getElementById("newEventDate").value;
  if (!clientName || !eventCode) {
    msg = "لازم اسم العميلة ورمز المناسبة"; msgType = "err"; render();
    return;
  }
  loading = true; render();
  const { ok, data } = await api("/event-register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ clientName, eventCode, eventType, eventDate }),
  });
  loading = false;
  if (ok && data.ok) {
    events = data.events;
    msg = `تم فتح قسم "${clientName}" ✓`; msgType = "ok";
  } else {
    msg = (data && data.message) || "تعذر إنشاء المناسبة"; msgType = "err";
  }
  render();
}

async function setStatus(eventCode, status) {
  if (status === "finished" && !confirm("تأكيد إنهاء هذي المناسبة؟ تقدرين ترجعينها نشطة بعدين لو احتجتِ.")) return;
  loading = true; render();
  const { ok, data } = await api("/event-finish", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ eventCode, status }),
  });
  loading = false;
  if (ok && data.ok) {
    events = data.events;
    msg = status === "finished" ? "تم نقل المناسبة للمنتهية ✓" : "تم تفعيل المناسبة مرة ثانية ✓";
    msgType = "ok";
  } else {
    msg = (data && data.message) || "تعذر التحديث"; msgType = "err";
  }
  render();
}

function eventCardHtml(ev) {
  const isFinished = ev.status === "finished";
  const dateLabel = ev.eventDate ? new Date(ev.eventDate).toLocaleDateString("ar-SA") : "";
  return `
    <div class="event-card ${isFinished ? "finished" : ""}">
      <div class="name">${escapeHtml(ev.clientName)}</div>
      <div class="meta">
        <span class="code">${escapeHtml(ev.eventCode)}</span>
        ${ev.eventType ? " · " + escapeHtml(ev.eventType) : ""}
        ${dateLabel ? " · " + dateLabel : ""}
      </div>
      <div class="event-actions">
        <button class="small secondary" onclick="window.open('checkin.html?event=${encodeURIComponent(ev.eventCode)}','_blank')">📋 فتح تسجيل الدخول</button>
        <button class="small secondary" onclick="window.open('index.html?event=${encodeURIComponent(ev.eventCode)}','_blank')">✉️ إرسال تذكير/شكر</button>
        ${isFinished
          ? `<button class="small secondary" onclick="setStatus('${escapeHtml(ev.eventCode)}','active')">↩️ إعادة تفعيل</button>`
          : `<button class="small danger" onclick="setStatus('${escapeHtml(ev.eventCode)}','finished')">✅ إنهاء المناسبة</button>`}
      </div>
    </div>`;
}

function render() {
  const app = el("app");
  const active = events.filter((e) => e.status !== "finished");
  const finished = events.filter((e) => e.status === "finished");

  app.innerHTML = `
    <div class="card">
      <h3>➕ فتح قسم عميلة جديدة</h3>
      <p class="muted">كل عميلة يصير لها قسم مستقل يضل مفتوح لين تخلصين منه (تذكير + شكر) وتضغطين "إنهاء المناسبة".</p>
      <input type="text" id="newClientName" placeholder="اسم العميلة (مثال: سارة وأحمد)">
      <input type="text" id="newEventCode" placeholder="رمز المناسبة (تختارينه إنتي، مثال: SARA2026)" style="direction:ltr;text-align:left">
      <select id="newEventType">
        <option value="">نوع المناسبة (اختياري)</option>
        <option value="زفاف">زفاف</option>
        <option value="مولود">مولود</option>
        <option value="تخرج">تخرج</option>
        <option value="مؤتمر">مؤتمر/شركات</option>
        <option value="أخرى">أخرى</option>
      </select>
      <input type="date" id="newEventDate">
      <button id="createBtn" ${loading ? "disabled" : ""}>فتح القسم</button>
      ${msg ? `<div class="${msgType}">${escapeHtml(msg)}</div>` : ""}
    </div>

    <div class="section-title">🟢 المناسبات النشطة (${active.length})</div>
    ${active.length === 0 ? `<div class="empty-state">ما فيه مناسبات نشطة حاليًا</div>` : active.map(eventCardHtml).join("")}

    ${finished.length ? `
      <div class="section-title">⚪ المناسبات المنتهية (${finished.length})</div>
      ${finished.map(eventCardHtml).join("")}
    ` : ""}
  `;

  const createBtn = document.getElementById("createBtn");
  if (createBtn) createBtn.addEventListener("click", createEvent);
}

window.setStatus = setStatus;
loadEvents();
</script>

</body>
</html>
